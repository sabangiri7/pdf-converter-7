<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDF Tools{% endblock %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pdf-tools-theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">PDF</span><span class="brand-name">Tools</span>
    </a>
    <div class="site-header-actions">
      <nav>
        <a href="{{ url_for('index') }}">All tools</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle"
              aria-pressed="false" aria-label="Switch to dark mode">
        Dark mode
      </button>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Files are deleted automatically after 1 hour. Everything runs on this
    server only.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
