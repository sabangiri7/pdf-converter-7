name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate sample fixtures
        run: python scripts/generate_samples.py

      - name: Ruff
        run: ruff check app tests scripts

      - name: Bandit
        run: bandit -r app -ll -x tests,.venv,samples -q

      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Pytest + coverage
        env:
          PDF_TOOLS_CONFIG: testing
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=55

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pdf-tools:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pdf-tools:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
